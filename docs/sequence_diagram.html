<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sequence Diagram - Real-Time Human Fall Detection</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #F8FAFC;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
        }
        h2 {
            color: #1E1B4B;
            margin-bottom: 5px;
        }
        p {
            color: #64748B;
            margin-bottom: 25px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid #E2E8F0;
        }
        svg {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <h2>🔄 Sequence Diagram</h2>
    <p>Component Interaction & Event Timing</p>
    
    <div class="container">
        <svg width="850" height="580" viewBox="0 0 850 580" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
                </marker>
                <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.1"/>
                </filter>
            </defs>

            <!-- Actors Header Nodes -->
            <rect x="50" y="30" width="130" height="50" rx="10" fill="#1E293B" filter="url(#shadow)"/>
            <text x="115" y="60" fill="white" font-weight="bold" font-size="14" text-anchor="middle">📹 Webcam</text>

            <rect x="240" y="30" width="140" height="50" rx="10" fill="#059669" filter="url(#shadow)"/>
            <text x="310" y="60" fill="white" font-weight="bold" font-size="14" text-anchor="middle">👤 PoseDetector</text>

            <rect x="440" y="30" width="160" height="50" rx="10" fill="#D97706" filter="url(#shadow)"/>
            <text x="520" y="60" fill="white" font-weight="bold" font-size="14" text-anchor="middle">📐 FeatureCalculator</text>

            <rect x="650" y="30" width="150" height="50" rx="10" fill="#DC2626" filter="url(#shadow)"/>
            <text x="725" y="60" fill="white" font-weight="bold" font-size="14" text-anchor="middle">🚨 FallDetector</text>

            <!-- Lifelines -->
            <line x1="115" y1="80" x2="115" y2="520" stroke="#94A3B8" stroke-dasharray="5 5" stroke-width="2"/>
            <line x1="310" y1="80" x2="310" y2="520" stroke="#94A3B8" stroke-dasharray="5 5" stroke-width="2"/>
            <line x1="520" y1="80" x2="520" y2="520" stroke="#94A3B8" stroke-dasharray="5 5" stroke-width="2"/>
            <line x1="725" y1="80" x2="725" y2="520" stroke="#94A3B8" stroke-dasharray="5 5" stroke-width="2"/>

            <!-- Sequence 1: Frame Capture -->
            <line x1="115" y1="130" x2="310" y2="130" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>
            <text x="210" y="120" fill="#1E293B" font-weight="600" font-size="12" text-anchor="middle">1. Pass BGR Frame</text>

            <!-- Sequence 2: Landmark Extraction -->
            <line x1="310" y1="200" x2="520" y2="200" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>
            <text x="415" y="190" fill="#1E293B" font-weight="600" font-size="12" text-anchor="middle">2. Pass 33 Joint Landmarks</text>

            <!-- Sequence 3: Feature Return -->
            <line x1="520" y1="270" x2="725" y2="270" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>
            <text x="620" y="260" fill="#1E293B" font-weight="600" font-size="12" text-anchor="middle">3. Send Angle (θ) & Aspect Ratio</text>

            <!-- Sequence 4: Check Fall Threshold -->
            <path d="M 725 330 C 770 330, 770 370, 725 370" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow)"/>
            <text x="735" y="345" fill="#DC2626" font-weight="bold" font-size="12">4. Check N ≥ 3 Frames</text>

            <!-- Sequence 5: Trigger Emergency Broadcast -->
            <line x1="725" y1="440" x2="115" y2="440" stroke="#DC2626" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
            <text x="420" y="430" fill="#DC2626" font-weight="bold" font-size="13" text-anchor="middle">5. Trigger Web Audio Siren & SOS Emergency Notification</text>
        </svg>
    </div>
</body>
</html>
