<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>System Architecture Diagram - Real-Time Human Fall Detection</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #F8FAFC;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
        }
        h2 {
            color: #1E1B4B;
            margin-bottom: 5px;
        }
        p {
            color: #64748B;
            margin-bottom: 25px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid #E2E8F0;
        }
        svg {
            max-width: 100%;
            height: auto;
        }
        .btn {
            margin-top: 20px;
            padding: 12px 24px;
            background: #2563EB;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:hover {
            background: #1D4ED8;
        }
    </style>
</head>
<body>
    <h2>📐 System Architecture Diagram</h2>
    <p>Real-Time Human Fall Detection System Architecture</p>
    
    <div class="container">
        <svg width="900" height="520" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#B91C1C;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1" />
                </linearGradient>

                <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.1"/>
                </filter>

                <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
                </marker>
            </defs>

            <!-- Node 1: Video Input -->
            <rect x="50" y="210" width="140" height="90" rx="12" fill="url(#grad1)" filter="url(#shadow)"/>
            <text x="120" y="248" fill="white" font-weight="bold" font-size="15" text-anchor="middle">📹 Webcam Input</text>
            <text x="120" y="270" fill="#DBEAFE" font-size="12" text-anchor="middle">OpenCV Capture (30 FPS)</text>

            <!-- Arrow 1 -> 2 -->
            <line x1="190" y1="255" x2="230" y2="255" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>

            <!-- Node 2: Pose Engine -->
            <rect x="240" y="210" width="160" height="90" rx="12" fill="url(#grad2)" filter="url(#shadow)"/>
            <text x="320" y="248" fill="white" font-weight="bold" font-size="15" text-anchor="middle">👤 MediaPipe Pose</text>
            <text x="320" y="270" fill="#D1FAE5" font-size="12" text-anchor="middle">33 3D Keypoint Detection</text>

            <!-- Arrow 2 -> 3 -->
            <line x1="400" y1="255" x2="440" y2="255" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>

            <!-- Node 3: Feature Calculator -->
            <rect x="450" y="210" width="170" height="90" rx="12" fill="url(#grad3)" filter="url(#shadow)"/>
            <text x="535" y="245" fill="white" font-weight="bold" font-size="15" text-anchor="middle">📐 Feature Calculator</text>
            <text x="535" y="268" fill="#FEF3C7" font-size="12" text-anchor="middle">Torso Angle (θ), Aspect Ratio</text>

            <!-- Arrow 3 -> 4 -->
            <line x1="620" y1="255" x2="660" y2="255" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>

            <!-- Node 4: Fall Detector Engine -->
            <rect x="670" y="210" width="180" height="90" rx="12" fill="url(#grad4)" filter="url(#shadow)"/>
            <text x="760" y="245" fill="white" font-weight="bold" font-size="15" text-anchor="middle">🚨 Fall Detector Engine</text>
            <text x="760" y="268" fill="#FEE2E2" font-size="12" text-anchor="middle">Rule Engine & Thresholding</text>

            <!-- Arrow 4 -> Output 1 (Top) -->
            <path d="M 760 210 L 760 130 L 700 130" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>

            <!-- Arrow 4 -> Output 2 (Bottom) -->
            <path d="M 760 300 L 760 390 L 700 390" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>

            <!-- Output Node 1: Streamlit Dashboard -->
            <rect x="450" y="85" width="240" height="85" rx="12" fill="url(#grad5)" filter="url(#shadow)"/>
            <text x="570" y="122" fill="white" font-weight="bold" font-size="15" text-anchor="middle">📊 Streamlit Web Dashboard</text>
            <text x="570" y="144" fill="#EDE9FE" font-size="12" text-anchor="middle">Live Stream, Telemetry & Gauges</text>

            <!-- Output Node 2: Emergency Response -->
            <rect x="450" y="345" width="240" height="85" rx="12" fill="url(#grad4)" filter="url(#shadow)"/>
            <text x="570" y="382" fill="white" font-weight="bold" font-size="15" text-anchor="middle">🔔 Emergency SOS Dispatch</text>
            <text x="570" y="404" fill="#FEE2E2" font-size="12" text-anchor="middle">Siren Alarm & Caregiver SMS/Call</text>
        </svg>
    </div>
</body>
</html>
