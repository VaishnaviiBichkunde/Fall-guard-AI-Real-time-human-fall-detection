<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Data Flowchart Diagram - Real-Time Human Fall Detection</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #F8FAFC;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
        }
        h2 {
            color: #1E1B4B;
            margin-bottom: 5px;
        }
        p {
            color: #64748B;
            margin-bottom: 25px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid #E2E8F0;
        }
        svg {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <h2>⚡ Fall Detection Process Flowchart</h2>
    <p>Algorithmic Execution Sequence & Decision Logic</p>
    
    <div class="container">
        <svg width="600" height="750" viewBox="0 0 600 750" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
                </marker>
                <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.1"/>
                </filter>
            </defs>

            <!-- Start Node -->
            <rect x="210" y="20" width="180" height="50" rx="25" fill="#3B82F6" filter="url(#shadow)"/>
            <text x="300" y="52" fill="white" font-weight="bold" font-size="15" text-anchor="middle">Start Stream</text>

            <!-- Line -->
            <line x1="300" y1="70" x2="300" y2="110" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>

            <!-- Node 1: Capture Frame -->
            <rect x="180" y="110" width="240" height="60" rx="10" fill="#1E293B" filter="url(#shadow)"/>
            <text x="300" y="145" fill="white" font-weight="bold" font-size="14" text-anchor="middle">Capture Frame & BGR→RGB</text>

            <!-- Line -->
            <line x1="300" y1="170" x2="300" y2="210" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>

            <!-- Node 2: MediaPipe Inference -->
            <rect x="170" y="210" width="260" height="60" rx="10" fill="#059669" filter="url(#shadow)"/>
            <text x="300" y="245" fill="white" font-weight="bold" font-size="14" text-anchor="middle">Extract 33 Pose Keypoints</text>

            <!-- Line -->
            <line x1="300" y1="270" x2="300" y2="310" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>

            <!-- Node 3: Calculate Angle & Ratio -->
            <rect x="160" y="310" width="280" height="65" rx="10" fill="#D97706" filter="url(#shadow)"/>
            <text x="300" y="340" fill="white" font-weight="bold" font-size="14" text-anchor="middle">Compute Torso Angle (θ)</text>
            <text x="300" y="360" fill="#FEF3C7" font-size="12" text-anchor="middle">& Downward Hip Speed (ΔY)</text>

            <!-- Line -->
            <line x1="300" y1="375" x2="300" y2="420" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>

            <!-- Decision Diamond: θ > 38° OR Ratio >= 0.8 -->
            <polygon points="300,420 440,480 300,540 160,480" fill="#4338CA" filter="url(#shadow)"/>
            <text x="300" y="475" fill="white" font-weight="bold" font-size="13" text-anchor="middle">Is θ ≥ 38° OR</text>
            <text x="300" y="493" fill="#E0E7FF" font-size="12" text-anchor="middle">Posture Horizontal?</text>

            <!-- Decision YES Branch -->
            <line x1="300" y1="540" x2="300" y2="590" stroke="#DC2626" stroke-width="3" marker-end="url(#arrow)"/>
            <text x="315" y="570" fill="#DC2626" font-weight="bold" font-size="13">YES</text>

            <!-- Decision NO Branch (Loop back) -->
            <path d="M 440 480 L 530 480 L 530 140 L 430 140" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrow)"/>
            <text x="470" y="470" fill="#059669" font-weight="bold" font-size="13">NO (Normal)</text>

            <!-- Node 4: Trigger Alarm -->
            <rect x="160" y="590" width="280" height="70" rx="12" fill="#DC2626" filter="url(#shadow)"/>
            <text x="300" y="622" fill="white" font-weight="bold" font-size="16" text-anchor="middle">🚨 FALL DETECTED!</text>
            <text x="300" y="645" fill="#FEE2E2" font-size="12" text-anchor="middle">Siren Alarm + SOS Caregiver Alert</text>
        </svg>
    </div>
</body>
</html>
